[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-ass-emul"
version = "1.3.14"
authors = [
  { name="Ondřej Nečas", email="py-ass-emul@notime.cz" },
]
description = "A small example package"
readme = "README.md"
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "re",
]

[project.urls]
"Homepage" = "https://github.com/Ninjaondra321/py-ass-emul"